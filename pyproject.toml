[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oasis-dm"
version = "2.3.0"
description = "Density modification (phase improvement) for macromolecular crystallography, without CCP4"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wei Ding" }]
keywords = ["crystallography", "density modification", "phase improvement",
            "SAD", "SIR", "MTZ", "solvent flattening", "histogram matching"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "gemmi>=0.6",
  "numpy>=1.22",
  "scipy>=1.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.scripts]
oasis-dm = "oasis_dm.cli:main"
oasis-dm-gui = "oasis_dm.gui:main"

[project.urls]
Homepage = "https://github.com/WeiDing535/oasis-dm"
Repository = "https://github.com/WeiDing535/oasis-dm"
Issues = "https://github.com/WeiDing535/oasis-dm/issues"
Changelog = "https://github.com/WeiDing535/oasis-dm/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oasis_dm = ["data/*.lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
